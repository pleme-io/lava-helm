[package]
authors = ["pleme-io"]
description = "lava-helm — autogenerated typed (deflava-resource …) shapes for the helm terraform provider. Mirrors pangea-helm. Source schema kept under schema.json; resources/*.tlisp + _index.tlisp regenerated via `lava-forge generate --schema schema.json --out resources`."
edition = "2024"
license = "MIT"
name = "lava-helm"
readme = "README.md"
repository = "https://github.com/pleme-io/lava-helm"
version = "0.1.0"

[lib]
name = "lava_helm"
path = "src/lib.rs"

[lints.clippy]
pedantic = "warn"
